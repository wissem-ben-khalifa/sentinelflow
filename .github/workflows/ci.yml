name: SentinelFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy scikit-learn psycopg2-binary sqlalchemy
          pip install pytest pytest-cov black flake8

      - name: Run linting
        run: |
          flake8 . --exclude=venv,__pycache__,.git,models --max-line-length=100 --ignore=E501,W503

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=profiling --cov=validation --cov=detection/statistical --cov=detection/drift --cov-report=xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml